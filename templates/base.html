<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Government Decision Support Agent{% endblock %}</title>
<meta name="description" content="AI-powered decision support platform for government ministries.">
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/dark-mode.css') }}">
{% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">

<div id="page-loader" class="page-loader">
  <div class="loader-ring"></div>
</div>

<div class="toast-stack" id="flash-stack">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="toast toast-{{ category }}" role="alert">
          <i class="fa-solid {{ {'success':'fa-circle-check','danger':'fa-circle-exclamation','warning':'fa-triangle-exclamation','info':'fa-circle-info'}[category] if category in ['success','danger','warning','info'] else 'fa-circle-info' }}"></i>
          <span>{{ message }}</span>
          <button class="toast-close" onclick="this.parentElement.remove()">&times;</button>
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}
</div>

{% block body %}{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="{{ url_for('static', filename='js/theme-toggle.js') }}"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
